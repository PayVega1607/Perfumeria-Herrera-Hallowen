<section class="seccion">
  <p class="sobretitulo">Herrera Perfumes · Catálogo 2026</p>
  <h2>Catálogo general</h2>
  <div class="tabs-coleccion" id="tabs-coleccion" role="group" aria-label="Colección">
    <button type="button" data-valor="" aria-pressed="true">Todas</button>
    <button type="button" data-valor="hombre" aria-pressed="false">Caballeros</button>
    <button type="button" data-valor="dama" aria-pressed="false">Damas</button>
  </div>
  <form id="filtros" class="filtros" autocomplete="off" role="search">
    <label class="f-busca">Buscar por nombre<input type="search" name="texto" placeholder="Ej.: Sauvage, Yara…"></label>
    <label>Marca<select name="marca"><option value="">Todas</option></select></label>
    <label>Público<select name="publico"><option value="">Todos</option><option value="hombre">Hombre</option><option value="dama">Mujer</option></select></label>
    <label>Precio mínimo<input type="number" name="min" min="0" step="1000" inputmode="numeric" placeholder="$ mín."></label>
    <label>Precio máximo<input type="number" name="max" min="0" step="1000" inputmode="numeric" placeholder="$ máx."></label>
    <button type="button" id="limpiar-filtros" class="btn btn-borde">Limpiar filtros</button>
  </form>
  <p id="contador-resultados" class="contador-resultados" aria-live="polite"></p>
  <div class="grilla" data-grid="catalogo"></div>
  <div id="sin-resultados" class="sin-resultados" hidden>
    <p>No encontramos perfumes con esos criterios.</p>
    <button type="button" id="limpiar-vacio" class="btn btn-lleno">Limpiar filtros</button>
  </div>
</section>
